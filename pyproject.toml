[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hwpx-eq"
version = "0.0.1"
description = "Bidirectional LaTeX <-> HWPX equation converter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wangyu" }]
dependencies = [
    "click>=8.1",
    "lark>=1.1",
    "lxml>=5.0",
    "pylatexenc>=2.10",
    "python-hwpx>=2.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
hwpx-eq = "hwpx_eq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hwpx_eq"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
